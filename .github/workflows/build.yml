name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and validate plugin structure
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPluginProjectConfiguration
      - uses: actions/upload-artifact@v4
        with:
          name: revision-graph-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  compatibility:
    name: Compatibility ${{ matrix.ide-version }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ide-version: [2025.3.6, 2026.1.4, 2026.2.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify IntelliJ ${{ matrix.ide-version }}
        run: ./gradlew verifyPlugin -PverifierIdeVersion=${{ matrix.ide-version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verifier-${{ matrix.ide-version }}
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
